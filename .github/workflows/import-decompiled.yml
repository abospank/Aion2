name: Import decompiled Aion2 project

on:
  push:
    paths:
      - 'transfer/_TRANSFER_READY'

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct transfer archive
        shell: bash
        run: |
          set -euxo pipefail
          cat transfer/part-*.b64 > /tmp/aion2-transfer.b64
          base64 -d /tmp/aion2-transfer.b64 > /tmp/aion2-project.tar.zst
          mkdir -p /tmp/aion2-import
          tar --use-compress-program=unzstd -xf /tmp/aion2-project.tar.zst -C /tmp/aion2-import

      - name: Import project files
        shell: bash
        run: |
          set -euxo pipefail
          rsync -a --exclude='.git/' --exclude='transfer/' /tmp/aion2-import/ ./
          rm -rf transfer
          rm -f .github/workflows/import-decompiled.yml

      - name: Commit decompiled project
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import full decompiled Aion2 project"
          git push
