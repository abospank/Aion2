name: Build player toolchain

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-player-toolchain.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare dependencies
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          rm -rf /tmp/playerbuild /tmp/deps
          mkdir -p /tmp/playerbuild
          echo '' | base64 -d > /tmp/playerbuild/build.gradle
          echo "rootProject.name='aion-player-toolchain'" > /tmp/playerbuild/settings.gradle
          gradle -p /tmp/playerbuild --no-daemon copyPlayerDeps
      - uses: actions/upload-artifact@v4
        with:
          name: aion-player-toolchain
          path: /tmp/deps
          if-no-files-found: error
          compression-level: 0
